# Playce API — alan adı gelene kadar geçici adres: http://94.138.209.152:8888
# 94.138.209.152:80 başka bir sitenin (efendioglu) server_name'i; 8888 güvenlik duvarında zaten açık.
# Alan adına geçiş: docs/09-yayin.md → "Alan adı gelince".
server {
    listen 8888;
    listen [::]:8888;
    server_name _;
    client_max_body_size 2m;

    # Düz HTTP'de admin anahtarı ağda açık gider: admin uçları HTTPS gelene kadar yalnız SSH tüneliyle.
    location /v1/admin/ {
        default_type application/json;
        return 403 '{"statusCode":403,"message":"Admin uçları HTTPS gelene kadar yalnız SSH tüneliyle (docs/09-yayin.md)"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
